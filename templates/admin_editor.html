<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<title>Visual Editor — Flaming News</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root{ --green:#92D050; --grey:#E7E6E6; --red:#FF0000; }
  * { box-sizing: border-box; }
  body { font-family: Calibri, Arial, sans-serif; background:#eef0f2; margin:0; padding:0; color:#222; }
  .topbar { position:sticky; top:0; z-index:60; background:#2c2c2c; color:#fff; padding:10px 20px; display:flex; align-items:center; gap:14px; }
  .topbar h1 { font-size:15px; margin:0; }
  .topbar a { color:#ffcc66; text-decoration:none; font-size:13px; }
  .topbar .spacer { flex:1; }
  .btn { background:#444; color:#fff; border:none; border-radius:4px; padding:7px 13px; font-size:13px; cursor:pointer; }
  .btn:hover { background:#5a5a5a; }
  .btn.primary { background:#2e7d32; }
  .btn.primary:hover { background:#388e3c; }
  .btn.small { padding:4px 9px; font-size:11px; }
  .btn.danger { background:#c0392b; }
  .hint { background:#fff8e1; border-bottom:1px solid #ffe08a; color:#8a6500; font-size:12px; padding:6px 20px; }
  .tabs { display:flex; gap:0; margin:16px 16px 0; }
  .tab { padding:9px 20px; background:#dfe3e6; border:1px solid #bbb; border-bottom:none; border-radius:6px 6px 0 0; cursor:pointer; font-weight:bold; color:#555; font-size:13px; }
  .tab.active { background:#fff; color:#000; }
  .sheet { max-width:1150px; margin:0 auto 30px; background:#fff; border:1px solid #bbb; padding:14px; }
  .section-block { border:2px dashed transparent; margin-bottom:10px; border-radius:4px; position:relative; }
  .section-block:hover { border-color:#4472C4; }
  .section-toolbar { display:none; position:absolute; top:-14px; right:4px; gap:4px; z-index:10; }
  .section-block:hover .section-toolbar { display:flex; }
  .section-toolbar button { font-size:10px; padding:2px 6px; border:1px solid #999; background:#fff; border-radius:3px; cursor:pointer; }
  table.grid { border-collapse:collapse; width:100%; table-layout:fixed; }
  table.grid td { border:1px solid #999; padding:4px 6px; font-size:12px; vertical-align:middle; }
  .section-title-cell { background:var(--green); font-weight:bold; text-align:center; padding:6px; cursor:pointer; }
  .section-title-cell:hover { outline:2px solid #4472C4; }
  .col-header { font-weight:bold; text-align:center; cursor:pointer; }
  .col-header:hover { outline:2px solid #4472C4; }
  .placeholder-cell { text-align:center; color:#555; }
  .add-col-btn { width:100%; background:#f4f4f4; border:1px dashed #999; cursor:pointer; font-size:16px; color:#888; padding:4px; }
  .add-section-bar { text-align:center; padding:14px; }
  .badge { font-weight:bold; padding:2px 8px; border-radius:2px; display:inline-block; }
  .fixed-note { font-size:11px; color:#999; padding:4px 8px; }

  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:200; display:none; align-items:center; justify-content:center; }
  .modal-overlay.open { display:flex; }
  .modal-box { background:#fff; border-radius:8px; padding:20px; width:380px; max-height:85vh; overflow:auto; }
  .modal-box h3 { margin:0 0 14px; font-size:15px; }
  .field-row { margin-bottom:10px; }
  .field-row label { display:block; font-size:12px; color:#555; margin-bottom:3px; }
  .field-row input[type=text], .field-row input[type=number], .field-row select {
    width:100%; padding:6px 8px; border:1px solid #bbb; border-radius:4px; font-size:13px;
  }
  .field-row input[type=color] { width:100%; height:32px; border:1px solid #bbb; padding:0; }
  .toggle-row { display:flex; gap:14px; margin-bottom:10px; }
  .toggle-row label { font-size:12px; display:flex; align-items:center; gap:5px; }
  .modal-actions { display:flex; gap:8px; margin-top:16px; justify-content:space-between; }
  .toast { position:fixed; bottom:20px; right:20px; background:#2e7d32; color:#fff; padding:10px 16px; border-radius:4px; font-size:13px; box-shadow:0 2px 8px rgba(0,0,0,.2); display:none; z-index:300; }
  .toast.error { background:#c0392b; }
</style>
</head>
<body>

<div class="topbar">
  <h1>🎨 Visual Editor</h1>
  <a href="/admin">← Admin Panel</a>
  <a href="/">Hesabat</a>
  <div class="spacer"></div>
  <button class="btn" id="saveDraftBtn">💾 Draft-ı saxla</button>
  <button class="btn primary" id="publishBtn">🚀 Publish</button>
</div>
<div class="hint">Bölmə başlığına və ya sütun başlığına klikləyin — stil, mətn, ölçü dəyişmək üçün. Sağ üstdə görünən düymələrlə bölməni yuxarı/aşağı sürüşdürə, silə bilərsiniz.</div>

<div class="tabs">
  <div class="tab active" data-tab="1">Sheet 1 — Accomodation</div>
  <div class="tab" data-tab="2">Sheet 2 — F&amp;B Section</div>
</div>

<div class="sheet" id="sheetView1"></div>
<div class="sheet" id="sheetView2" style="display:none;"></div>

<!-- ============ Section style/edit modal ============ -->
<div class="modal-overlay" id="sectionModal">
  <div class="modal-box">
    <h3>Bölməni redaktə et</h3>
    <div class="field-row"><label>Başlıq</label><input type="text" id="secTitle"></div>
    <div class="field-row"><label>Arxa fon rəngi</label><input type="color" id="secBg"></div>
    <div class="field-row"><label>Mətn rəngi</label><input type="color" id="secColor"></div>
    <div class="toggle-row">
      <label><input type="checkbox" id="secBold"> Bold</label>
      <label><input type="checkbox" id="secItalic"> Italic</label>
      <label><input type="checkbox" id="secUnderline"> Underline</label>
    </div>
    <div class="field-row"><label>Şrift ölçüsü (px)</label><input type="number" id="secFontSize" min="8" max="30"></div>
    <div class="modal-actions">
      <button class="btn danger small" id="secDeleteBtn">🗑 Bölməni sil</button>
      <div>
        <button class="btn small" id="secCancelBtn">Bağla</button>
        <button class="btn primary small" id="secApplyBtn">Tətbiq et</button>
      </div>
    </div>
  </div>
</div>

<!-- ============ Column style/edit modal ============ -->
<div class="modal-overlay" id="colModal">
  <div class="modal-box">
    <h3>Sütunu redaktə et</h3>
    <div class="field-row"><label>Başlıq (Label)</label><input type="text" id="colLabel"></div>
    <div class="field-row"><label>En (%)</label><input type="number" id="colWidth" min="3" max="70"></div>
    <div class="field-row"><label>Növ (kind)</label>
      <select id="colKind">
        <option value="text">Text</option>
        <option value="text_left">Text (sola düzülmüş)</option>
        <option value="date">Tarix (DD.MM.YYYY)</option>
        <option value="time">Vaxt (HH:MM)</option>
        <option value="vip_code">VIP Kod</option>
        <option value="guest_with_photo">Qonaq adı + foto</option>
        <option value="remarks">Remarks (review-highlight dəstəkli)</option>
      </select>
    </div>
    <div class="field-row"><label>Arxa fon rəngi</label><input type="color" id="colBg"></div>
    <div class="field-row"><label>Mətn rəngi</label><input type="color" id="colColor"></div>
    <div class="toggle-row">
      <label><input type="checkbox" id="colBold"> Bold</label>
      <label><input type="checkbox" id="colItalic"> Italic</label>
      <label><input type="checkbox" id="colUnderline"> Underline</label>
    </div>
    <div class="field-row"><label>Alignment</label>
      <select id="colAlign"><option value="center">Center</option><option value="left">Left</option><option value="right">Right</option></select>
    </div>
    <div class="field-row"><label>Padding (px)</label><input type="number" id="colPadding" min="0" max="20"></div>
    <div class="modal-actions">
      <button class="btn danger small" id="colDeleteBtn">🗑 Sütunu sil</button>
      <div>
        <button class="btn small" id="colCancelBtn">Bağla</button>
        <button class="btn primary small" id="colApplyBtn">Tətbiq et</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let DRAFT = null;
let editingSectionIdx = null;
let editingColRef = null; // {sectionIdx, colIdx}

function toast(msg, isError=false) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast' + (isError?' error':'');
  t.style.display = 'block';
  setTimeout(()=>{ t.style.display='none'; }, 2800);
}

function styleToCss(style) {
  style = style || {};
  let css = '';
  if (style.bg) css += `background:${style.bg};`;
  if (style.color) css += `color:${style.color};`;
  if (style.bold) css += `font-weight:bold;`;
  if (style.italic) css += `font-style:italic;`;
  if (style.underline) css += `text-decoration:underline;`;
  if (style.font_size) css += `font-size:${style.font_size}px;`;
  if (style.align) css += `text-align:${style.align};`;
  if (style.padding != null) css += `padding:${style.padding}px;`;
  return css;
}

const PLACEHOLDER = {
  text: 'Sample text', text_left: 'Sample text', date: '16.08.2026', time: '14:00',
  remarks: 'Sample remark', guest_with_photo: 'Guest Name',
};

async function loadDraft() {
  const res = await fetch('/api/admin/config/draft');
  DRAFT = await res.json();
  render();
}

function render() {
  renderSheet(1, 'sheetView1');
  renderSheet(2, 'sheetView2');
}

function renderSheet(sheetNum, containerId) {
  const container = document.getElementById(containerId);
  container.innerHTML = '';
  const sections = (DRAFT.sections||[])
    .map((s,i)=>({...s, _idx:i}))
    .filter(s => s.sheet === sheetNum)
    .sort((a,b)=>(a.order||0)-(b.order||0));

  sections.forEach(section => {
    const block = document.createElement('div');
    block.className = 'section-block';
    if (!section.enabled) block.style.opacity = '0.4';

    const toolbar = document.createElement('div');
    toolbar.className = 'section-toolbar';
    const upBtn = document.createElement('button'); upBtn.textContent='↑'; upBtn.title='Yuxarı';
    upBtn.onclick = () => moveSection(section._idx, -1);
    const downBtn = document.createElement('button'); downBtn.textContent='↓'; downBtn.title='Aşağı';
    downBtn.onclick = () => moveSection(section._idx, 1);
    const toggleBtn = document.createElement('button'); toggleBtn.textContent = section.enabled ? '👁' : '🚫';
    toggleBtn.title = 'Aktiv/Deaktiv';
    toggleBtn.onclick = () => { DRAFT.sections[section._idx].enabled = !DRAFT.sections[section._idx].enabled; render(); };
    toolbar.appendChild(upBtn); toolbar.appendChild(downBtn); toolbar.appendChild(toggleBtn);
    block.appendChild(toolbar);

    const table = document.createElement('table');
    table.className = 'grid';

    const titleTr = document.createElement('tr');
    const titleTd = document.createElement('td');
    titleTd.colSpan = 9;
    titleTd.className = 'section-title-cell';
    titleTd.textContent = section.title;
    titleTd.setAttribute('style', styleToCss(section.style));
    titleTd.addEventListener('click', () => openSectionModal(section._idx));
    titleTr.appendChild(titleTd);
    table.appendChild(titleTr);

    if (section.type === 'table') {
      const headTr = document.createElement('tr');
      (section.columns||[]).forEach((col, ci) => {
        const th = document.createElement('td');
        th.className = 'col-header';
        th.textContent = col.label;
        th.style.width = (col.width_pct||10) + '%';
        if (col.colspan > 1) th.colSpan = col.colspan;
        th.setAttribute('style', th.getAttribute('style') + ';' + styleToCss(col.style));
        th.addEventListener('click', () => openColumnModal(section._idx, ci));
        headTr.appendChild(th);
      });
      const addColTd = document.createElement('td');
      const addColBtn = document.createElement('button');
      addColBtn.className = 'add-col-btn'; addColBtn.textContent = '+';
      addColBtn.title = 'Yeni sütun əlavə et';
      addColBtn.onclick = () => addColumn(section._idx);
      addColTd.appendChild(addColBtn);
      headTr.appendChild(addColTd);
      table.appendChild(headTr);

      const bodyTr = document.createElement('tr');
      (section.columns||[]).forEach(col => {
        const td = document.createElement('td');
        td.className = 'placeholder-cell';
        td.setAttribute('style', styleToCss(col.style));
        if (col.kind === 'vip_code') {
          const b = document.createElement('span'); b.className='badge';
          b.style.cssText = 'background:#70AD47;color:#000;'; b.textContent = 'SA';
          td.appendChild(b);
        } else {
          td.textContent = PLACEHOLDER[col.kind] || 'Sample';
        }
        if (col.colspan > 1) td.colSpan = col.colspan;
        bodyTr.appendChild(td);
      });
      bodyTr.appendChild(document.createElement('td'));
      table.appendChild(bodyTr);
    } else if (section.type === 'parallel_lines') {
      const headTr = document.createElement('tr');
      const l = document.createElement('td'); l.colSpan = section.left.colspan; l.className='col-header'; l.textContent = section.left.label;
      const r = document.createElement('td'); r.colSpan = section.right.colspan; r.className='col-header'; r.textContent = section.right.label;
      headTr.appendChild(l); headTr.appendChild(r); table.appendChild(headTr);
    } else if (section.type === 'fixed') {
      const noteTr = document.createElement('tr');
      const noteTd = document.createElement('td'); noteTd.colSpan = 9; noteTd.className = 'fixed-note';
      noteTd.textContent = '(Bu bölmənin daxili sahələri hələ tam redaktə olunmur — yalnız başlıq stilini dəyişə, aktiv/deaktiv edə, sıralaya bilərsiniz.)';
      noteTr.appendChild(noteTd); table.appendChild(noteTr);
    }

    block.appendChild(table);
    container.appendChild(block);
  });

  const addBar = document.createElement('div');
  addBar.className = 'add-section-bar';
  const addBtn = document.createElement('button');
  addBtn.className = 'btn primary'; addBtn.textContent = '+ Yeni bölmə əlavə et';
  addBtn.onclick = () => addSection(sheetNum);
  addBar.appendChild(addBtn);
  container.appendChild(addBar);
}

function moveSection(idx, dir) {
  const s = DRAFT.sections[idx];
  const sameSheet = DRAFT.sections.filter(x => x.sheet === s.sheet).sort((a,b)=>(a.order||0)-(b.order||0));
  const pos = sameSheet.indexOf(s);
  const swapWith = sameSheet[pos+dir];
  if (!swapWith) return;
  const tmp = s.order; s.order = swapWith.order; swapWith.order = tmp;
  render();
}

function addSection(sheetNum) {
  const title = prompt('Yeni bölmənin adı:');
  if (!title) return;
  const maxOrder = Math.max(0, ...DRAFT.sections.map(s=>s.order||0));
  const id = 'custom_' + Date.now();
  DRAFT.sections.push({
    id, sheet: sheetNum, title, type: 'table', enabled: true, order: maxOrder + 1,
    data_key: id,
    columns: [
      {key:'col1', label:'Sütun 1', width_pct:30, colspan:1, kind:'text'},
      {key:'col2', label:'Sütun 2', width_pct:30, colspan:1, kind:'text'},
    ],
  });
  render();
  toast('Bölmə əlavə edildi — Draft-ı saxlamağı unutmayın.');
}

function addColumn(sectionIdx) {
  const label = prompt('Yeni sütunun adı:', 'Yeni sütun');
  if (!label) return;
  const section = DRAFT.sections[sectionIdx];
  const key = 'field_' + Date.now();
  section.columns.push({key, label, width_pct:15, colspan:1, kind:'text'});
  render();
}

// ---------- section modal ----------
function openSectionModal(idx) {
  editingSectionIdx = idx;
  const s = DRAFT.sections[idx];
  document.getElementById('secTitle').value = s.title || '';
  const st = s.style || {};
  document.getElementById('secBg').value = st.bg || '#92D050';
  document.getElementById('secColor').value = st.color || '#000000';
  document.getElementById('secBold').checked = !!st.bold;
  document.getElementById('secItalic').checked = !!st.italic;
  document.getElementById('secUnderline').checked = !!st.underline;
  document.getElementById('secFontSize').value = st.font_size || '';
  document.getElementById('sectionModal').classList.add('open');
}
document.getElementById('secCancelBtn').onclick = () => document.getElementById('sectionModal').classList.remove('open');
document.getElementById('secApplyBtn').onclick = () => {
  const s = DRAFT.sections[editingSectionIdx];
  s.title = document.getElementById('secTitle').value;
  s.style = {
    bg: document.getElementById('secBg').value,
    color: document.getElementById('secColor').value,
    bold: document.getElementById('secBold').checked,
    italic: document.getElementById('secItalic').checked,
    underline: document.getElementById('secUnderline').checked,
    font_size: parseInt(document.getElementById('secFontSize').value) || null,
  };
  document.getElementById('sectionModal').classList.remove('open');
  render();
};
document.getElementById('secDeleteBtn').onclick = () => {
  if (!confirm('Bu bölməni silmək istədiyinizə əminsiniz?')) return;
  DRAFT.sections.splice(editingSectionIdx, 1);
  document.getElementById('sectionModal').classList.remove('open');
  render();
};

// ---------- column modal ----------
function openColumnModal(sectionIdx, colIdx) {
  editingColRef = {sectionIdx, colIdx};
  const col = DRAFT.sections[sectionIdx].columns[colIdx];
  document.getElementById('colLabel').value = col.label || '';
  document.getElementById('colWidth').value = col.width_pct || 15;
  document.getElementById('colKind').value = col.kind || 'text';
  const st = col.style || {};
  document.getElementById('colBg').value = st.bg || '#ffffff';
  document.getElementById('colColor').value = st.color || '#000000';
  document.getElementById('colBold').checked = !!st.bold;
  document.getElementById('colItalic').checked = !!st.italic;
  document.getElementById('colUnderline').checked = !!st.underline;
  document.getElementById('colAlign').value = st.align || 'center';
  document.getElementById('colPadding').value = st.padding != null ? st.padding : '';
  document.getElementById('colModal').classList.add('open');
}
document.getElementById('colCancelBtn').onclick = () => document.getElementById('colModal').classList.remove('open');
document.getElementById('colApplyBtn').onclick = () => {
  const {sectionIdx, colIdx} = editingColRef;
  const col = DRAFT.sections[sectionIdx].columns[colIdx];
  col.label = document.getElementById('colLabel').value;
  col.width_pct = parseInt(document.getElementById('colWidth').value) || 15;
  col.kind = document.getElementById('colKind').value;
  col.style = {
    bg: document.getElementById('colBg').value,
    color: document.getElementById('colColor').value,
    bold: document.getElementById('colBold').checked,
    italic: document.getElementById('colItalic').checked,
    underline: document.getElementById('colUnderline').checked,
    align: document.getElementById('colAlign').value,
    padding: document.getElementById('colPadding').value !== '' ? parseInt(document.getElementById('colPadding').value) : null,
  };
  document.getElementById('colModal').classList.remove('open');
  render();
};
document.getElementById('colDeleteBtn').onclick = () => {
  if (!confirm('Bu sütunu silmək istədiyinizə əminsiniz?')) return;
  const {sectionIdx, colIdx} = editingColRef;
  DRAFT.sections[sectionIdx].columns.splice(colIdx, 1);
  document.getElementById('colModal').classList.remove('open');
  render();
};

// ---------- tabs ----------
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    document.getElementById('sheetView1').style.display = t.dataset.tab==='1' ? '' : 'none';
    document.getElementById('sheetView2').style.display = t.dataset.tab==='2' ? '' : 'none';
  });
});

// ---------- save / publish ----------
document.getElementById('saveDraftBtn').addEventListener('click', async () => {
  const res = await fetch('/api/admin/config/draft', {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(DRAFT)
  });
  const j = await res.json();
  if (j.status === 'ok') { DRAFT = j.config; toast('Draft saxlanıldı.'); }
  else toast('Xəta baş verdi', true);
});
document.getElementById('publishBtn').addEventListener('click', async () => {
  if (!confirm('Dizayn dəyişikliklərini canlıya çıxarmaq istədiyinizə əminsiniz?')) return;
  await fetch('/api/admin/config/draft', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(DRAFT)});
  const res = await fetch('/api/admin/config/publish', { method:'POST' });
  const j = await res.json();
  if (j.status === 'ok') toast('Publish edildi ✅');
  else toast('Xəta baş verdi', true);
});

loadDraft();
</script>
</body>
</html>
